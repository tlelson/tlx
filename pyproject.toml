# TODO: dynamic versioning
# [build-system]
# requires = ["poetry-core>=1.0.0", "poetry-dynamic-versioning"]
# build-backend = "poetry.dynamic_versioning.backend"
[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "tlx"
# We'll read version dynamically
version = "0.0.1"  # This will be overridden during build
description = "Frequently used utilities and code."
authors = ["tlelson <tpj800@gmail.com>"]
license = "Apache"
repository = "https://github.com/tlelson/tlx"
readme = "README.md"
# packages = [{include = "tlx"}]
include = ["version.txt", "requirements.txt"]
# include = ["scripts/*"]

[tool.poetry.dependencies]
python = ">=3.7,<4.0"
# TODO: Dependencies will be read from requirements.txt during build
boto3 = "^1.26.0"
click = "^8.1.3"

# [tool.poetry-dynamic-versioning]
# enable = true
# vcs = "git"
# pattern = "(?P<base>\\d+\\.\\d+\\.\\d+)"
# format = "{base}"
# style = "semver"
# # Read version from file
# from-file = "version.txt"

[tool.poetry.scripts]
# Console scripts
get-aws-creds = "tlx.util.cli_apps.get_aws_creds:main"
dynamo-batch-write = "tlx.dynamodb.cli_apps.dynamodb_batch_write:dbw"
dynamo-clear-table = "tlx.dynamodb.cli_apps.dynamodb_clear_table:dct"
test_import = "tlx.test_import:main"

# Scripts from tools directory
list-accounts = { reference = "tools/list-accounts", type = "file" }
stack = { reference = "tools/stack", type = "file" }
cfn = { reference = "tools/cfn", type = "file" }
dns = { reference = "tools/dns", type = "file" }
cloudtrail = { reference = "tools/cloudtrail", type = "file" }
apig = { reference = "tools/apig", type = "file" }
lambda = { reference = "tools/lambda", type = "file" }
get-creds = { reference = "tools/get-creds", type = "file" }
s3 = { reference = "tools/s3", type = "file" }
secrets = { reference = "tools/secrets", type = "file" }
iam = { reference = "tools/iam", type = "file" }
ec2 = { reference = "tools/ec2", type = "file" }
